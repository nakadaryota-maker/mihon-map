<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>市区町村 × 選挙区 × 人口</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map {
            height: 100vh;
        }

        .leaflet-container {
            outline: none;
        }

        .leaflet-interactive:focus {
            outline: none !important;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script>

        const map = L.map('map').setView([36, 138], 5);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // 色分け
        function getColor(d) {
            return d > 700000 ? '#800026' :
                d > 600000 ? '#BD0026' :
                    d > 500000 ? '#E31A1C' :
                        d > 400000 ? '#FC4E2A' :
                            '#FD8D3C';
        }

        // ホバー（ここが本体）
        function onEachFeature(feature, layer) {

            const name = feature.properties.municipalityName;
            const pop = feature.properties.総数;
            const district = feature.properties.districtName;

            layer.bindTooltip(
                `${name}<br>
     人口: ${pop}<br>
     選挙区: ${district}`,
                { sticky: true }
            );
        }

        // 表示
        fetch('./municipality_with_population.geojson')
            .then(res => res.json())
            .then(data => {

                L.geoJSON(data, {
                    style: function (feature) {
                        return {
                            fillColor: getColor(feature.properties.総数),
                            weight: 1,
                            color: "#efefef",
                            fillOpacity: 0.7
                        };
                    },
                    onEachFeature: onEachFeature
                }).addTo(map);

            });

        fetch('./electoral-districts.geojson')
            .then(res => res.json())
            .then(data => {

                L.geoJSON(data, {
                    interactive: false,

                    style: function (feature) {
                        return {
                            color: "#000",
                            weight: 2.5,
                            fillOpacity: 0
                        };
                    }
                }).addTo(map);

            });

    </script>
</body>

</html>
